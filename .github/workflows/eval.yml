name: eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest (no API key needed)
        run: pytest -q

      - name: Retrieval evaluation (optional secret)
        # 若仓库设置了 secret SILICONFLOW_API_KEY，则跑召回@5 评估；
        # 未设置时 evaluation.py 会自动跳过（退出 0），不阻断 CI。
        env:
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
        run: python evaluation.py
        continue-on-error: true
